; ============================================================
; GameDev 游戏配置（game.ini）
; ============================================================
;
; 说明（必读）：
;   1. 修改本文件后重启游戏即生效，无需重新编译。
;   2. 删除本文件也能正常运行——所有数值会回退到内置默认值。
;   3. 窗口尺寸变化时，背景图会自动拉伸铺满新窗口。
;
; 格式：
;   - 每行一个「键=值」；
;   - 以 ; 或 # 开头的行是注释，空行会被忽略；
;   - 等号两侧的空格可有可无；
;   - 值写错（如 player_hp=abc）时会记录警告并回退默认值。
; ============================================================

; 窗口宽度（像素）。默认：1280
window_width=1280

; 窗口高度（像素）。默认：720
window_height=720

; 垂直同步：1 开启（默认）/ 0 关闭。
; 开启后渲染与显示器刷新对齐：画面无撕裂、CPU 占用低；
; 关闭后帧率不设上限（CPU 占用高，适合观察固定步长在无 vsync 下的表现）
vsync=1

; ============================================================
; 输入绑定（动作 -> 物理按键；运行期改键入口）
; ============================================================
; 键名大小写不敏感，支持：
;   - 字母 A~Z、数字 0~9、功能键 F1~F12；
;   - 命名键：ESC/ESCAPE、ENTER/RETURN、KP_ENTER、SPACE、TAB、
;     BACKSPACE、LEFT/RIGHT/UP/DOWN、SHIFT、CTRL/CONTROL、ALT。
; 键名无法识别时记录警告并回退该动作的内置默认键，游戏照常可玩。

; 上移（默认键：W）
bind_move_up=W

; 下移（默认键：S）
bind_move_down=S

; 左移（默认键：A）
bind_move_left=A

; 右移（默认键：D）
bind_move_right=D

; 【说明】攻击 = 鼠标左键：按住按冷却节奏连续横扫、单击挥一次。
; 它按「动作绑定」走鼠标路（bindMouse），不占 bind_* 的键盘配置项

; 暂停/恢复（默认键：ESC）
bind_pause=ESC

; 重新开始（默认键：R）。
; 批六乙起 GameOver 退役、死亡改为自动复活流；M3·甲起 R 重新启用：
; 仅 Playing/Paused 响应，重开一局并清空粒子/震屏（面板/过场中不响应）
bind_restart=R

; 暂停界面返回主菜单（默认键：M）。批六乙起 M 退出前会静默比较并写盘
; 本局战绩（旧「中途退出不计」口径退役）
bind_menu=M

; 神龛激活（默认键：E）：走近未激活的复活点（约 64px）后按此键激活；
; 激活后视觉发亮、本局保持，R 重开/新对局重置（草地默认激活、雪山未激活）
bind_activate=E

; 主菜单确认进入对局（默认键：ENTER；小键盘回车同样有效）
bind_confirm=ENTER

; 升级三选一：按 1/2/3 选择法术（默认键：1/2/3；批五B 起选项为法术池）。
; 批五A 起面板同时支持鼠标：悬停卡片高亮、左键点击卡片选择（点击以
; 「左键按下边缘」为准——面板弹出时若已按住左键，需先松开再点，防误触）
bind_choice_1=1
bind_choice_2=2
bind_choice_3=3

; 商店开/关（默认键：B）：对局进行中随时可按——打开时世界暂停（同暂停
; 语义），B 或 ESC 关闭；九项强化只能在此用金币购买（升级三选一改发法术，
; 批五B）。商店面板支持鼠标悬停/点击与数字键两路购买
bind_shop=B

; 商店购买快捷键（默认键：1~9）：按数字键购买对应强化项（与鼠标点击
; 等价；动作名 shop_1~shop_9，各自可改键——与升级面板的 bind_choice_*
; 是不同动作，互不影响）
bind_shop_1=1
bind_shop_2=2
bind_shop_3=3
bind_shop_4=4
bind_shop_5=5
bind_shop_6=6
bind_shop_7=7
bind_shop_8=8
bind_shop_9=9

; ============================================================
; 玩家
; ============================================================

; 玩家移动速度（像素/秒）。默认：300
player_speed=300

; 玩家加速度（像素/秒²）：有方向输入时，当前速度向目标速度（player_speed）
; 靠拢的速率。默认 1800 时从静止加速到 300 像素/秒约需 0.17 秒
player_accel=1800

; 玩家摩擦减速度（像素/秒²）：无方向输入时，当前速度衰减到 0 的速率。
; 默认 2400 时从 300 像素/秒减速到静止约需 0.13 秒（松键后轻微滑行）
player_friction=2400

; 玩家行走动画每帧时长（秒）。默认：0.15
player_anim_interval=0.15

; 玩家生命上限（HP）。默认：100
player_hp=100

; 攻击冷却（秒）：鼠标左键按住时，两次横扫出手之间的最小间隔。默认：0.4
attack_cooldown=0.4

; 横扫表现时长（秒）：每次出手后，刀锋从 −半张角扫到 +半张角的总时间；
; 判定与画面共用同一条「快起慢收」曲线（实现见 Src/inc/game/AttackArc.h），
; 刀锋扫到哪里、伤害就结算到哪里。默认：0.10
attack_swing_time=0.10

; 横扫伤害（点）：每次出手对命中弧内「每只」怪物造成的伤害。默认：25
attack_damage=25

; 横扫半径（像素）：以玩家中心为圆心、鼠标瞄准方向为中轴的扇形半径；
; 弧内（距离不超过本值）的怪物才会被命中。默认：96
attack_range=96

; 横扫总张角（度）：扇形以鼠标瞄准方向为中轴，向两侧各张开一半
; （默认 120 度 = 中轴两侧各 60 度）。默认：120
attack_arc=120

; 横扫命中击退（像素）：命中的怪物沿背离玩家方向弹开的距离（微击退，
; 保持追击压力）。默认：30
attack_knockback=30

; ============================================================
; 升级与成长（经验曲线；升级成长由三选一法术提供——批五B）
; ============================================================
; 曲线：needed(level) = 四舍五入(xp_level_base x xp_level_growth^(level-1))，
; 即「从当前级升到下一级」所需经验；溢出的经验循环结算（一枚经验宝石
; 可连升多级）。
; 升级成长（批五B 起）：每次升级弹出三张随机法术（按 1/2/3 抉择、世界
; 冻结、连升连选），选择立即生效；法术池六种（火球术/冰霜新星/闪电链/
; 治疗之光/灼烧光环/护盾术），未学可学、已学叠层上限 5，层数参数与
; 冷却为代码常量——见 Src/inc/game/Spell.h。
; 九项强化（利刃/疾风/长臂/横扫/疾行/体魄/重击/慧眼/聚宝）已退出升级
; 流程，改为商店金币购买（B 键开商店；价格 = 基础价 x(层数+1)，
; 表见 Src/inc/game/Shop.h 与 UpgradeCard.h）。
; 【已移除】levelup_max_hp_bonus / levelup_damage_bonus / levelup_speed_bonus
; （旧的每级自动强化）已随 M2 退役删除，本文件不再读取这三条键。

; 升级曲线基数（点）：第 1 级升第 2 级所需经验。默认：30
xp_level_base=30

; 升级曲线倍率：升级需求的逐级倍率（写坏不致命——小于 1 或非法值按 1
; 处理，需求退化为恒等于基数）。默认 1.35 时前几级需求约为
; 30 / 41 / 55 / 74 / 100 ...
xp_level_growth=1.35

; ============================================================
; 怪物（追击小怪；六变体：草地原色三型 + 雪山冰霜三型。
; 外观/生命/基础速度/进攻模组均为代码常量，见 Monster.cpp 变体表与
; game/AttackModule.h；本文件只保留全局行为参数）
; ============================================================

; 【已移除】monster_speed：三变体改版后基础速度由变体常量提供
; （史莱姆 90 / 哥布林 110 / 骷髅 140），该键不再被代码读取

; 怪物速度成长（像素/秒）：实际速度 = 变体基础速度 + 本值 x 局内已过秒数。
; 默认 2.5 表示每多过 1 秒、追击速度快 2.5 像素/秒；
; 速度封顶 260 像素/秒（代码内固定，低于玩家默认速度 300，保证跑得掉），
; 默认参数下约 60 秒到达封顶值
; 【更名】旧键 enemy_speed_growth 已更改为 monster_speed_growth
monster_speed_growth=2.5

; 刷新间隔初始值（秒）：首只之后，刷新节奏从本值随时间收紧，
; 下限 1 秒（代码内固定）。默认：2.5
monster_spawn_interval=2.5

; 场上怪物数量上限初始值（只）：开局上限，随后每 20 秒 +2，
; 封顶 12（代码内固定）。默认：4
monster_max_count=4

; 【已移除】monster_hp：三变体改版后生命值由变体常量提供
; （史莱姆 20 / 哥布林 30 / 骷髅 18），该键不再被代码读取

; 怪物攻击伤害（点）：任意攻击模组命中玩家时扣除的基础生命值（批四起
; 伤害改由「攻击命中」结算——不再「碰到即扣」；批六丙按怪物等级放大，
; 批六丁再乘攻击模组的伤害倍率——当前六型均为 1.0）。默认：10
monster_damage=10

; 怪物攻击冷却（秒）：两次出招之间的最小间隔。
; 六型模组的蓄力/位移/命中半径/元素参数见 game/AttackModule.h：
;   史莱姆/冰史莱姆：跳跃砸击 0.45s -> 80px/0.3s -> 落点 40px（冰史莱姆减速）；
;   哥布林/霜哥布林：前扑 0.35s -> 24px/0.12s（霜哥布林冻结条 +35）；
;   骷髅/霜骷髅：突刺 0.30s -> 140px/0.25s，撞墙/命中即止（霜骷髅 +30）。
; 冻结条衰减（批六补丁）：连续 3 秒未受霜击才开始按每秒 10 衰减；
; 每次霜击都会刷新这 3 秒计时（满 100 冻结 1.5s、结束后 2s 抗冻缓冲）。
; 收势 0.2s / 命中回弹 40px 为代码常量（见 Monster.h）；玩家受击击退
;（约 42px、0.18s）与红染（0.3s）同样为代码常量（见 Player.h）。默认：1.2
monster_attack_cooldown=1.2

; 巡逻半径（像素）：怪物绕「巢」（出生点）游荡的范围半径。
; 怪物在巢周围这个小圈里缓步闲逛（间以 1~2 秒停顿）——「它有自己的地盘」。
; 默认：96
monster_patrol_radius=96

; 仇恨半径（像素）：玩家中心进入此距离内，怪物从巡逻/回巢转为追击
;（恰好等于半径也算进入仇恨——玩家已贴上警戒线）。默认：320
monster_aggro_radius=320

; 栓绳半径（像素）：怪物离「巢」超过此距离即回巢（追击中也不追过此范围；
; 恰好等于半径不触发，超出 1 像素以上才回）。适度拉大 = 追得更远。
; 默认：500
monster_leash_radius=500

; 回巢回血（最大生命的百分比）：怪物回到巢穴时按此百分比回复生命
;（预留配置键，0 = 关闭——默认关闭；>0 生效，如 50 = 回一半血）。
; 本批只做储备不做消费——供将来与商店/强化体系联动调整难度
monster_return_heal_percent=0

; ============================================================
; Boss（M3·乙：双区 Boss）
; ============================================================

; Boss 降临间隔（秒）：首只 = 开局后本值秒；此后每本值秒尝试一次。
; 场上同时最多 1 只 Boss——已有存活则本次跳过（日志说明）。
; 生成位置 = 玩家周围 500~700px 环带（激活区块内、可走、避水）；
; 归属区按生成点判定：草地 = 哥布林王（Lv20）/ 雪山 = 霜爵（Lv30）。
; 默认：180；调试/冒烟可调小（如 8）
boss_interval_seconds=180

; Boss 击杀回血（最大生命百分比）：击杀 Boss 后立即回复玩家生命。
; 默认：30（规格 30%，可调）；0 = 关闭，>100 按 100 处理
boss_kill_heal_percent=30

; ============================================================
; 掉落与拾取（批四：经验自动吸收 / 金币磁吸）
; ============================================================

; 金币磁吸半径（像素）：玩家中心进入该半径后，金币朝玩家加速吸引、
; 触及即拾取；范围外金币静止不动（仍可走过去拾取）。默认：140
coin_magnet_radius=140

; 【说明】经验宝石无需配置：击落后自动飞向玩家（速度 700~900 像素/秒
; 加速，顶部与加速度为代码常量，见 XpGem.h）——玩家无需走动

; ============================================================
; 世界与相机（批二·世界与相机；批六甲·世界重构）
; ============================================================

; 世界区块数（横向 / 纵向）：世界像素尺寸 = 区块数 x 1536 像素
; （每区块 32 x 32 格、每格 48 像素——批六甲由 16 格放大为 32 格）。
; 默认 8 x 4 = 12288 x 6144：西侧 4x4 区块为「草地」、东侧 4x4 区块
; 为「雪山」（分区表与查询见 Src/inc/game/Zone.h；雪山移速 x0.85 为
; 该表的代码常量）。世界最外 2 圈为海洋水域（批六甲·海洋边界：取代
; 原边界墙，玩家与怪物都不可进入——「入水」归后续批次）。
; 一般无需改动；改小时探索半径随之压缩（相机激活窗口按 ±1 区块跟随）
world_chunks_x=8
world_chunks_y=4

; 世界生成种子：0 = 每局随机（默认，每次开局地形不同）；
; 非 0 = 固定种子——同一布局完全可复现（调试与确定性冒烟验证用）
world_seed=0

; 相机平滑时间常数（秒）：相机跟随玩家的指数平滑，越大越「拖」
;（镜头慢半拍）、越小越「贴」（几乎锁定玩家中心）。默认：0.12
camera_smooth_time=0.12
