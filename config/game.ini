; ============================================================
; GameDev 游戏配置（game.ini）
; ============================================================
;
; 说明（必读）：
;   1. 修改本文件后重启游戏即生效，无需重新编译。
;   2. 删除本文件也能正常运行——所有数值会回退到内置默认值。
;   3. 窗口尺寸变化时，背景图会自动拉伸铺满新窗口。
;
; 格式：
;   - 每行一个「键=值」；
;   - 以 ; 或 # 开头的行是注释，空行会被忽略；
;   - 等号两侧的空格可有可无；
;   - 值写错（如 player_hp=abc）时会记录警告并回退默认值。
; ============================================================

; 窗口宽度（像素）。默认：1280
window_width=1280

; 窗口高度（像素）。默认：720
window_height=720

; 垂直同步：1 开启（默认）/ 0 关闭。
; 开启后渲染与显示器刷新对齐：画面无撕裂、CPU 占用低；
; 关闭后帧率不设上限（CPU 占用高，适合观察固定步长在无 vsync 下的表现）
vsync=1

; ============================================================
; 输入绑定（动作 -> 物理按键；运行期改键入口）
; ============================================================
; 键名大小写不敏感，支持：
;   - 字母 A~Z、数字 0~9、功能键 F1~F12；
;   - 命名键：ESC/ESCAPE、ENTER/RETURN、KP_ENTER、SPACE、TAB、
;     BACKSPACE、LEFT/RIGHT/UP/DOWN、SHIFT、CTRL/CONTROL、ALT。
; 键名无法识别时记录警告并回退该动作的内置默认键，游戏照常可玩。

; 上移（默认键：W）
bind_move_up=W

; 下移（默认键：S）
bind_move_down=S

; 左移（默认键：A）
bind_move_left=A

; 右移（默认键：D）
bind_move_right=D

; 【已移除】攻击键 bind_attack：本批战斗改为「自动攻击」（靠近怪物自动出手），
; 原 bind_attack 配置项随之退役，游戏中不再占用任何攻击按键

; 暂停/恢复（默认键：ESC）
bind_pause=ESC

; 结束界面按 R 重新开始（默认键：R）
bind_restart=R

; 暂停/结束界面返回主菜单（默认键：M）
bind_menu=M

; 主菜单确认进入对局（默认键：ENTER；小键盘回车同样有效）
bind_confirm=ENTER

; ============================================================
; 玩家
; ============================================================

; 玩家移动速度（像素/秒）。默认：300
player_speed=300

; 玩家加速度（像素/秒²）：有方向输入时，当前速度向目标速度（player_speed）
; 靠拢的速率。默认 1800 时从静止加速到 300 像素/秒约需 0.17 秒
player_accel=1800

; 玩家摩擦减速度（像素/秒²）：无方向输入时，当前速度衰减到 0 的速率。
; 默认 2400 时从 300 像素/秒减速到静止约需 0.13 秒（松键后轻微滑行）
player_friction=2400

; 玩家行走动画每帧时长（秒）。默认：0.15
player_anim_interval=0.15

; 玩家生命上限（HP）。默认：100
player_hp=100

; 自动攻击冷却（秒）：两次自动出手之间的最小间隔。默认：0.4
attack_cooldown=0.4

; 自动攻击伤害（点）：每次出手对目标怪物造成的伤害。默认：25
attack_damage=25

; 自动攻击范围（像素）：与「最近怪物」的中心距离小于该值即自动出手；
; 范围外没有怪物时不出手（不消耗冷却）。默认：96
attack_range=96

; ============================================================
; 怪物（追击小怪；本批由「敌人 enemy_*」更名而来，数值语义不变）
; ============================================================

; 怪物基础移动速度（像素/秒）。默认：110
; 【更名】旧键 enemy_speed 已更改为 monster_speed
monster_speed=110

; 怪物速度成长（像素/秒）：实际速度 = monster_speed + 本值 x 局内已过秒数。
; 默认 2.5 表示每多过 1 秒、追击速度快 2.5 像素/秒；
; 速度封顶 260 像素/秒（代码内固定，低于玩家默认速度 300，保证跑得掉），
; 默认参数下约 60 秒到达封顶值
; 【更名】旧键 enemy_speed_growth 已更改为 monster_speed_growth
monster_speed_growth=2.5

; 刷新间隔初始值（秒）：首只之后，刷新节奏从本值随时间收紧，
; 下限 1 秒（代码内固定）。默认：2.5
monster_spawn_interval=2.5

; 场上怪物数量上限初始值（只）：开局上限，随后每 20 秒 +2，
; 封顶 12（代码内固定）。默认：4
monster_max_count=4

; 怪物生命值（点）：需要几次挥击才能击杀（默认 30 = 2 次挥击）。默认：30
monster_hp=30

; 怪物接触伤害（点）：碰到玩家时扣除的生命值。默认：10
monster_damage=10
