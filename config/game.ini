; ============================================================
; GameDev 游戏配置（game.ini）
; ============================================================
;
; 说明（必读）：
;   1. 修改本文件后重启游戏即生效，无需重新编译。
;   2. 删除本文件也能正常运行——所有数值会回退到内置默认值。
;   3. 窗口尺寸变化时，背景图会自动拉伸铺满新窗口。
;
; 格式：
;   - 每行一个「键=值」；
;   - 以 ; 或 # 开头的行是注释，空行会被忽略；
;   - 等号两侧的空格可有可无；
;   - 值写错（如 round_seconds=abc）时会记录警告并回退默认值。
; ============================================================

; 窗口宽度（像素）。默认：1280
window_width=1280

; 窗口高度（像素）。默认：720
window_height=720

; 垂直同步：1 开启（默认）/ 0 关闭。
; 开启后渲染与显示器刷新对齐：画面无撕裂、CPU 占用低；
; 关闭后帧率不设上限（CPU 占用高，适合观察固定步长在无 vsync 下的表现）
vsync=1

; 玩家移动速度（像素/秒）。默认：300
player_speed=300

; 玩家加速度（像素/秒²）：有方向输入时，当前速度向目标速度（player_speed）
; 靠拢的速率。默认 1800 时从静止加速到 300 像素/秒约需 0.17 秒
player_accel=1800

; 玩家摩擦减速度（像素/秒²）：无方向输入时，当前速度衰减到 0 的速率。
; 默认 2400 时从 300 像素/秒减速到静止约需 0.13 秒（松键后轻微滑行）
player_friction=2400

; 玩家行走动画每帧时长（秒）。默认：0.15
player_anim_interval=0.15

; 场上金币数量。默认：5
coin_count=5

; 金币旋转动画每帧时长（秒）。默认：0.12
coin_anim_interval=0.12

; 每局对局时长（秒）。默认：30
round_seconds=30

; ============================================================
; 敌人与难度曲线（追击小怪）
; ============================================================

; 敌人基础移动速度（像素/秒）。默认：110
enemy_speed=110

; 敌人速度成长（像素/秒）：实际速度 = enemy_speed + 本值 x 局内已过秒数。
; 默认 2.5 表示每多过 1 秒、追击速度快 2.5 像素/秒；
; 速度封顶 260 像素/秒（代码内固定，低于玩家默认速度 300，保证跑得掉），
; 默认参数下约 60 秒到达封顶值
enemy_speed_growth=2.5

; 第 1 只敌人的出现时间（自进入对局起计的秒数）。默认：5
enemy_first_spawn=5

; 增援间隔（秒）：第一只之后，每过这么久就多出现 1 只，直到达到数量上限。
; 默认 10：第 1 只在 5 秒、第 2 只在 15 秒、第 3 只在 25 秒出现
enemy_spawn_interval=10

; 场上敌人数量上限。默认：3
enemy_max_count=3

; 被敌人撞中的时间惩罚（秒）：从剩余时间中扣除的秒数。默认：5
enemy_hit_penalty=5
